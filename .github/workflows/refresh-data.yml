name: Refresh data cache

# Keeps data-cache/*.rds fresh so Posit Connect Cloud — which deploys straight
# from this repo's git history with no build step — always has pre-warmed
# data to read instead of fetching live at startup (see tools/prewarm.R and
# R/_setup.R's SEED_DIR). A push here triggers Connect Cloud's own
# git-linked auto-redeploy; this workflow does not talk to Connect Cloud.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # .Rprofile activates renv, which would point .libPaths() at an empty
  # renv/library. This job installs current binaries with pak rather than
  # restoring the lockfile, so the autoloader has to stay out of the way.
  RENV_CONFIG_AUTOLOADER_ENABLED: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # pak resolves Ubuntu system dependencies and installs P3M binaries at
      # their current versions. renv::restore() would instead source-build
      # every package the lockfile pins behind P3M's current release, which
      # is what used to break this job. The job only writes .rds data files,
      # so it does not need the app's exact pinned versions.
      #
      # This list covers what tools/prewarm.R reaches: the library() calls in
      # R/_setup.R plus the packages R/utils.R and R/_setup.R use by ::.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::curl
            any::dplyr
            any::here
            any::jsonlite
            any::lubridate
            any::realestatebr
            any::shiny
            any::tibble
            any::tidyr
            any::trendseries

      - name: Prewarm data cache
        run: Rscript tools/prewarm.R

      - name: Commit and push refreshed data-cache/
        run: |
          if git diff --quiet -- data-cache/; then
            echo "No data changes; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-cache
          git commit -m "Refresh data cache [skip ci]"
          git push
